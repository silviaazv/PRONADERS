<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRONADERS — Proyecciones de Finalización</title>
    <link rel="icon" type="image/png" href="/img/favicon-escudo.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/proyecciones.css">
</head>
<body>

    <!-- Estos dos contenedores llegan vacíos. shared.js les inyecta el menú
         lateral y la barra superior, que son iguales en todas las pantallas
         y se arman según el rol del usuario que inició sesión. -->
    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>

    <!-- Las tarjetas de proyección se calculan en el navegador a partir del
         avance histórico de cada proyecto, por eso este espacio arranca
         vacío. -->
    <main class="main">
        <div id="proyecciones-content">
            <!-- Se muestra mientras se hacen los cálculos; proyecciones.js
                 reemplaza todo este bloque cuando termina. -->
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>Calculando proyecciones...</p>
            </div>
        </div>
    </main>

    <!-- Aviso emergente para confirmaciones y errores. Vive escondido hasta
         que alguien llama a toast() desde shared.js. -->
    <div class="toast" id="toast">
        <span class="material-symbols-rounded" id="toast-icon" style="font-size:18px">check_circle</span>
        <span id="toast-msg"></span>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/proyecciones.js"></script>
</body>
</html>
