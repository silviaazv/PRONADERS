<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRONADERS — Gestión de Proyectos</title>
    <link rel="icon" type="image/png" href="/img/favicon-escudo.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/proyectos.css">
</head>
<body>

    <!-- Estos dos contenedores llegan vacíos. shared.js les inyecta el menú
         lateral y la barra superior, que son iguales en todas las pantallas
         y se arman según el rol del usuario que inició sesión. -->
    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>

    <!-- El listado de proyectos lo dibuja proyectos.js; lo que se muestra
         depende del rol, porque un supervisor de campo solo ve los
         proyectos que tiene asignados. -->
    <main class="main" id="main-proyectos">
        <div id="proyectos-content">
            <!-- Se muestra mientras llegan los datos; proyectos.js reemplaza
                 todo este bloque al terminar de cargar. -->
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>Cargando proyectos...</p>
            </div>
        </div>
    </main>

    <!-- Ficha completa del proyecto en modo lectura. Tanto el encabezado
         como el cuerpo se rellenan desde proyectos.js con el proyecto en
         el que se hizo clic. -->
    <div class="modal-overlay" id="modal-detalle">
        <div class="modal" style="max-width:780px;padding:0;overflow:hidden">
            <div id="detalle-header" style="padding:28px 32px 22px;border-bottom:1px solid var(--cream-dark)">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
                    <div>
                        <div id="detalle-tipo" style="font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px"></div>
                        <div id="detalle-nombre" style="font-family:var(--font-serif);font-size:24px;font-weight:300;color:var(--navy)"></div>
                        <div id="detalle-ubicacion" style="font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px"></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                        <span id="detalle-badge" class="badge"></span>
                        <button class="close-btn" onclick="document.getElementById('modal-detalle').classList.remove('open')">
                            <span class="material-symbols-rounded">close</span>
                        </button>
                    </div>
                </div>
            </div>
            <div style="padding:24px 32px;max-height:72vh;overflow-y:auto" id="detalle-body"></div>
        </div>
    </div>

    <!-- Este mismo formulario sirve para crear y para editar. Al editar, los
         campos se rellenan con los datos existentes y, si el proyecto ya está
         cerrado, todo queda deshabilitado. -->
    <div class="modal-overlay" id="modal-nuevo">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Nuevo <em style="font-style:italic">Proyecto</em></div>
                <button class="close-btn" onclick="cerrarModalNuevo()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <!-- Aviso de proyecto cerrado. Nace oculto y solo aparece cuando
                 setModoSoloLectura() (en js/proyectos.js) detecta que el
                 proyecto está CANCELADO o FINALIZADO; esa misma función le
                 cambia el ícono, el texto y el color según el caso. -->
            <div id="np-aviso-cerrado" style="display:none;background:var(--danger-bg);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:var(--danger);align-items:center;gap:8px">
                <span class="material-symbols-rounded" id="np-aviso-icono" style="font-size:16px">block</span>
                <span id="np-aviso-texto">Este proyecto está CANCELADO. Sus datos son de solo lectura y no puede reactivarse.</span>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Nombre del proyecto</label>
                    <input type="text" class="form-control" id="np-nombre" placeholder="Ej. Puente Choluteca">
                </div>
                <div class="form-group">
                    <label class="form-label">Tipo de proyecto</label>
                    <select class="form-control" id="np-tipo">
                        <option value="INFRAESTRUCTURA">Infraestructura</option>
                        <option value="AGRICOLA">Agrícola</option>
                        <option value="SOCIAL">Social</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Departamento</label>
                    <select class="form-control" id="sel-depto" onchange="cargarMunicipios()">
                        <option value="">— Selecciona un departamento —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Municipio</label>
                    <select class="form-control" id="sel-municipio" disabled>
                        <option value="">— Primero selecciona departamento —</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Fecha de inicio</label>
                    <input type="date" class="form-control" id="np-inicio" onchange="validarRangoFechas()">
                </div>
                <div class="form-group">
                    <label class="form-label">Fecha estimada de fin</label>
                    <input type="date" class="form-control" id="np-fin" onchange="validarRangoFechas()">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Presupuesto total (L)</label>
                <input type="number" class="form-control" id="np-presupuesto" placeholder="0.00" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label class="form-label">Supervisor de Campo</label>
                <select class="form-control" id="np-supervisor">
                    <option value="">— Selecciona un supervisor —</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" id="np-desc" rows="3" placeholder="Descripción general del proyecto..."></textarea>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end">
                <button class="btn btn-outline" onclick="cerrarModalNuevo()">Cancelar</button>
                <button class="btn btn-gold" id="btn-guardar-proyecto" onclick="guardarProyecto()">
                    <span class="material-symbols-rounded">save</span> Guardar Proyecto
                </button>
            </div>
        </div>
    </div>

    <!-- Aviso emergente para confirmaciones y errores. Vive escondido hasta
         que alguien llama a toast() desde shared.js. -->
    <div class="toast" id="toast">
        <span class="material-symbols-rounded" id="toast-icon" style="font-size:18px">check_circle</span>
        <span id="toast-msg"></span>
    </div>

    <!-- Cierre del proyecto. Se pide aparte el monto realmente ejecutado
         porque casi nunca coincide con el presupuesto aprobado, y ese dato
         es el que después se compara en los reportes. Ojo: finalizar un
         proyecto no tiene vuelta atrás. -->
<div class="modal-overlay" id="modal-finalizar">
    <div class="modal" style="max-width:480px">
        <div class="modal-header">
            <div class="modal-title">Finalizar <em style="font-style:italic">Proyecto</em></div>
            <button class="close-btn" onclick="cerrarModalFinalizar()">
                <span class="material-symbols-rounded">close</span>
            </button>
        </div>
        <div style="background:var(--cream);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:12.5px;color:var(--text-light)">
            <strong id="modal-finalizar-nombre"></strong>
        </div>
        <div class="form-group">
            <label class="form-label">Monto ejecutado (L) <span style="color:var(--danger)">*</span></label>
            <input type="number" class="form-control" id="finalizar-monto" placeholder="0.00" min="0" step="0.01">
            <div style="font-size:11px;color:var(--muted);margin-top:4px">Ingresa el monto total ejecutado del proyecto</div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-outline" onclick="cerrarModalFinalizar()">Cancelar</button>
            <button class="btn btn-success" onclick="confirmarFinalizar()">
                <span class="material-symbols-rounded">check_circle</span> Finalizar Proyecto
            </button>
        </div>
    </div>
</div>

    <script src="../js/api.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/proyectos.js"></script>
</body>
</html>
