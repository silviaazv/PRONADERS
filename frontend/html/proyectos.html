<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRONADERS — Gestión de Proyectos</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/proyectos.css">
</head>
<body>

    <!-- ===== SIDEBAR + TOPBAR (shared) ===== -->
    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main" id="main-proyectos">
        <div id="proyectos-content">
            <!-- Loading spinner -->
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>Cargando proyectos...</p>
            </div>
        </div>
    </main>

    <!-- ===== MODAL DETALLE PROYECTO ===== -->
    <div class="modal-overlay" id="modal-detalle">
        <div class="modal" style="max-width:780px;padding:0;overflow:hidden">
            <div id="detalle-header" style="padding:28px 32px 22px;border-bottom:1px solid var(--cream-dark)">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
                    <div>
                        <div id="detalle-tipo" style="font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px"></div>
                        <div id="detalle-nombre" style="font-family:var(--font-serif);font-size:24px;font-weight:300;color:var(--navy)"></div>
                        <div id="detalle-ubicacion" style="font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px"></div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                        <span id="detalle-badge" class="badge"></span>
                        <button class="close-btn" onclick="document.getElementById('modal-detalle').classList.remove('open')">
                            <span class="material-symbols-rounded">close</span>
                        </button>
                    </div>
                </div>
            </div>
            <div style="padding:24px 32px;max-height:72vh;overflow-y:auto" id="detalle-body"></div>
        </div>
    </div>

    <!-- ===== MODAL NUEVO PROYECTO ===== -->
    <div class="modal-overlay" id="modal-nuevo">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Nuevo <em style="font-style:italic">Proyecto</em></div>
                <button class="close-btn" onclick="cerrarModalNuevo()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Nombre del proyecto</label>
                    <input type="text" class="form-control" id="np-nombre" placeholder="Ej. Puente Choluteca">
                </div>
                <div class="form-group">
                    <label class="form-label">Tipo de proyecto</label>
                    <select class="form-control" id="np-tipo">
                        <option value="INFRAESTRUCTURA">Infraestructura</option>
                        <option value="AGRICOLA">Agrícola</option>
                        <option value="SOCIAL">Social</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Departamento</label>
                    <select class="form-control" id="sel-depto" onchange="cargarMunicipios()">
                        <option value="">— Selecciona un departamento —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Municipio</label>
                    <select class="form-control" id="sel-municipio" disabled>
                        <option value="">— Primero selecciona departamento —</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Fecha de inicio</label>
                    <input type="date" class="form-control" id="np-inicio" onchange="validarRangoFechas()">
                </div>
                <div class="form-group">
                    <label class="form-label">Fecha estimada de fin</label>
                    <input type="date" class="form-control" id="np-fin" onchange="validarRangoFechas()">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Presupuesto total (L)</label>
                <input type="number" class="form-control" id="np-presupuesto" placeholder="0.00" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" id="np-desc" rows="3" placeholder="Descripción general del proyecto..."></textarea>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end">
                <button class="btn btn-outline" onclick="cerrarModalNuevo()">Cancelar</button>
                <button class="btn btn-gold" onclick="guardarProyecto()">
                    <span class="material-symbols-rounded">save</span> Guardar Proyecto
                </button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <span class="material-symbols-rounded" id="toast-icon" style="font-size:18px">check_circle</span>
        <span id="toast-msg"></span>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/proyectos.js"></script>
</body>
</html>
