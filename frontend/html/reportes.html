<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRONADERS — Reportes de Avance</title>
    <link rel="icon" type="image/png" href="/img/favicon-escudo.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/reportes.css">
</head>
<body>

    <!-- ===== SIDEBAR + TOPBAR (shared) ===== -->
    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">
        <div id="reportes-content">
            <!-- Loading spinner -->
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>Cargando reportes...</p>
            </div>
        </div>
    </main>

    <!-- ===== MODAL NUEVO REPORTE ===== -->
    <div class="modal-overlay" id="modal-reporte">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Nuevo <em style="font-style:italic">Reporte de Avance</em></div>
                <button class="close-btn" onclick="cerrarModalReporte()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>

            <div class="form-group">
                <label class="form-label">Proyecto <span style="color:var(--danger)">*</span></label>
                <select class="form-control" id="rep-proyecto">
                    <option value="">— Selecciona un proyecto —</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Avance físico (%)</label>
                    <div class="flex-between mb-8">
                        <span class="text-xs text-muted">0%</span>
                        <span class="range-val" id="val-fisico">50%</span>
                    </div>
                    <input type="range" min="0" max="100" value="50" class="range-input" 
                           oninput="document.getElementById('val-fisico').textContent=this.value+'%'">
                </div>
                <div class="form-group">
                    <label class="form-label">Avance financiero (%)</label>
                    <div class="flex-between mb-8">
                        <span class="text-xs text-muted">0%</span>
                        <span class="range-val" id="val-fin">40%</span>
                    </div>
                    <input type="range" min="0" max="100" value="40" class="range-input"
                           oninput="document.getElementById('val-fin').textContent=this.value+'%'">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Descripción del avance <span style="color:var(--danger)">*</span></label>
                <textarea class="form-control" id="rep-desc" rows="3" placeholder="Describe el trabajo realizado en este período..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Incidencias</label>
                <textarea class="form-control" id="rep-incidencias" rows="2" placeholder="Problemas o imprevistos encontrados (opcional)..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Observaciones técnicas</label>
                <textarea class="form-control" id="rep-observaciones" rows="2" placeholder="Comentarios adicionales (opcional)..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Adjuntar evidencias (foto / PDF)</label>
                <div class="dropzone" tabindex="0" role="button"
                     onclick="document.getElementById('rep-file-input').click()"
                     onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('rep-file-input').click()}"
                     ondragover="event.preventDefault();this.style.borderColor='var(--gold)'"
                     ondragleave="this.style.borderColor=''"
                     ondrop="event.preventDefault();this.style.borderColor='';mostrarArchivosRep(event.dataTransfer.files)">
                    <span class="material-symbols-rounded" style="font-size:28px;display:block;margin-bottom:6px;color:var(--cream-dark)">upload_file</span>
                    <span style="font-size:12.5px;color:var(--muted)">Arrastra archivos aquí o <strong style="color:var(--navy)">haz clic</strong> para seleccionar</span>
                    <input type="file" id="rep-file-input" multiple accept=".pdf,.jpg,.jpeg,.png,.docx" style="display:none" onchange="mostrarArchivosRep(this.files)">
                </div>
                <div id="rep-files" style="margin-top:8px;display:flex;flex-direction:column;gap:6px"></div>
            </div>

            <div style="background:var(--info-bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:20px;font-size:12.5px;color:var(--info);display:flex;gap:8px;align-items:center;">
                <span class="material-symbols-rounded" style="font-size:16px">info</span>
                El reporte será enviado al Administrador de Oficina para su revisión.
            </div>

            <div style="display:flex;gap:10px;justify-content:flex-end">
                <button class="btn btn-outline" onclick="cerrarModalReporte()">Cancelar</button>
                <button class="btn btn-gold" onclick="enviarReporte()">
                    <span class="material-symbols-rounded">send</span> Enviar Reporte
                </button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <span class="material-symbols-rounded" id="toast-icon" style="font-size:18px">check_circle</span>
        <span id="toast-msg"></span>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/shared.js"></script>
    <script src="../js/reportes.js"></script>
</body>
</html>
